[package]
name = "foundry-evm-networks"
description = "Custom network features, like precompiles and custom tx types"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-chains.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-op-hardforks.workspace = true
alloy-primitives = { workspace = true, features = [
    "serde",
    "getrandom",
    "arbitrary",
    "rlp",
] }

# Base precompile dispatch (--base flag). Path deps on the user's local
# base/base clone; see base-anvil/README.md for layout. Pulling these into
# foundry-evm-networks is what makes base precompile dispatch work from
# `forge test` (and `cast`), not just from `anvil`.
base-common-precompiles = { path = "../../../../base/crates/common/precompiles" }
base-common-chains = { path = "../../../../base/crates/common/chains" }

revm = { workspace = true, features = [
    "std",
    "serde",
    "memory_limit",
    "optional_eip3607",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "arbitrary",
    "c-kzg",
    "blst",
] }

clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
serde.workspace = true